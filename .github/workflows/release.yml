name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create-release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: AuraTerm ${{ github.ref_name }}
          draft: true
          prerelease: false
          generate_release_notes: true

  build:
    name: Build (${{ matrix.os }}-${{ matrix.target }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            arch: x64
          - os: macos-latest
            target: x86_64-apple-darwin
            arch: x64
          - os: macos-latest
            target: aarch64-apple-darwin
            arch: arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AuraTerm ${{ github.ref_name }}'
          releaseBody: 'See Changelog.md for details'
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

      - name: Build MSIX artifacts
        if: matrix.os == 'windows-latest'
        shell: powershell
        env:
          AURATERM_MSIX_PACKAGE_NAME: ${{ vars.AURATERM_MSIX_PACKAGE_NAME }}
          AURATERM_MSIX_PUBLISHER: ${{ vars.AURATERM_MSIX_PUBLISHER }}
          AURATERM_MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.AURATERM_MSIX_PUBLISHER_DISPLAY_NAME }}
          AURATERM_MSIX_DISPLAY_NAME: ${{ vars.AURATERM_MSIX_DISPLAY_NAME }}
          AURATERM_MSIX_DESCRIPTION: ${{ vars.AURATERM_MSIX_DESCRIPTION }}
          AURATERM_MSIX_MIN_VERSION: ${{ vars.AURATERM_MSIX_MIN_VERSION }}
          AURATERM_MSIX_MAX_VERSION_TESTED: ${{ vars.AURATERM_MSIX_MAX_VERSION_TESTED }}
        run: |
          .\scripts\package-msix.ps1 -SkipBuild -MsixUpload -Target '${{ matrix.target }}'

      - name: Upload MSIX release assets
        if: matrix.os == 'windows-latest'
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $assets = Get-ChildItem -Path src-tauri/target/release/bundle/msix -File |
            Where-Object { $_.Extension -in '.msix', '.msixupload', '.appxsym' }

          if (-not $assets) {
            throw 'No MSIX artifacts were generated for the Windows release build.'
          }

          $assetPaths = $assets | ForEach-Object { $_.FullName }
          gh release upload ${{ github.ref_name }} $assetPaths --clobber

  publish-release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish Release
        run: |
          gh release edit ${{ github.ref_name }} --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
