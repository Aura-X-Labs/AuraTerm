name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create-release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: AuraTerm ${{ github.ref_name }}
          draft: true
          prerelease: false
          generate_release_notes: true

  build:
    name: Build (${{ matrix.os }}-${{ matrix.target }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            arch: x64
          - os: macos-latest
            target: x86_64-apple-darwin
            arch: x64
          - os: macos-latest
            target: aarch64-apple-darwin
            arch: arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Configure Windows signing environment
        if: matrix.os == 'windows-latest'
        shell: powershell
        env:
          AURATERM_WINDOWS_PFX_BASE64: ${{ secrets.AURATERM_WINDOWS_PFX_BASE64 }}
          AURATERM_WINDOWS_PFX_PASSWORD: ${{ secrets.AURATERM_WINDOWS_PFX_PASSWORD }}
          AURATERM_WINDOWS_DIGEST_ALGORITHM: ${{ secrets.AURATERM_WINDOWS_DIGEST_ALGORITHM }}
          AURATERM_WINDOWS_TIMESTAMP_URL: ${{ secrets.AURATERM_WINDOWS_TIMESTAMP_URL }}
        run: |
          $algorithm = if ($env:AURATERM_WINDOWS_DIGEST_ALGORITHM) { $env:AURATERM_WINDOWS_DIGEST_ALGORITHM } else { 'sha256' }
          $timestampUrl = if ($env:AURATERM_WINDOWS_TIMESTAMP_URL) { $env:AURATERM_WINDOWS_TIMESTAMP_URL } else { 'http://timestamp.digicert.com' }
          "AURATERM_WINDOWS_DIGEST_ALGORITHM=$algorithm" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "AURATERM_WINDOWS_TIMESTAMP_URL=$timestampUrl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          if ($env:AURATERM_WINDOWS_PFX_BASE64 -and $env:AURATERM_WINDOWS_PFX_PASSWORD) {
            New-Item -ItemType Directory -Force -Path certificate | Out-Null
            Set-Content -Path certificate/tempCert.txt -Value $env:AURATERM_WINDOWS_PFX_BASE64
            certutil -decode certificate/tempCert.txt certificate/certificate.pfx | Out-Null
            $password = ConvertTo-SecureString -String $env:AURATERM_WINDOWS_PFX_PASSWORD -Force -AsPlainText
            $certificate = Import-PfxCertificate -FilePath certificate/certificate.pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password

            if (-not $certificate) {
              throw 'Failed to import the Windows signing certificate in GitHub Actions.'
            }

            "AURATERM_WINDOWS_CERT_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Remove-Item certificate -Recurse -Force
            Write-Host 'Windows signing certificate imported successfully.'
          }
          else {
            Write-Host 'Windows signing certificate secrets are not set. Windows release build will remain unsigned.'
          }

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AuraTerm ${{ github.ref_name }}'
          releaseBody: 'See Changelog.md for details'
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

  publish-release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish Release
        run: |
          gh release edit ${{ github.ref_name }} --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
