name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run build

  build:
    name: Build (${{ matrix.os }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build -- --target ${{ matrix.target }}

      - name: Build MSIX artifacts
        if: matrix.os == 'windows-latest'
        shell: powershell
        env:
          AURATERM_MSIX_PACKAGE_NAME: ${{ vars.AURATERM_MSIX_PACKAGE_NAME }}
          AURATERM_MSIX_PUBLISHER: ${{ vars.AURATERM_MSIX_PUBLISHER }}
          AURATERM_MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.AURATERM_MSIX_PUBLISHER_DISPLAY_NAME }}
          AURATERM_MSIX_DISPLAY_NAME: ${{ vars.AURATERM_MSIX_DISPLAY_NAME }}
          AURATERM_MSIX_DESCRIPTION: ${{ vars.AURATERM_MSIX_DESCRIPTION }}
          AURATERM_MSIX_MIN_VERSION: ${{ vars.AURATERM_MSIX_MIN_VERSION }}
          AURATERM_MSIX_MAX_VERSION_TESTED: ${{ vars.AURATERM_MSIX_MAX_VERSION_TESTED }}
        run: |
          .\scripts\package-msix.ps1 -SkipBuild -MsixUpload -Target '${{ matrix.target }}'

      - name: Upload MSIX artifacts
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-msix-${{ matrix.target }}
          path: |
            src-tauri/target/release/bundle/msix/*.msix
            src-tauri/target/release/bundle/msix/*.msixupload
            src-tauri/target/release/bundle/msix/*.appxsym
