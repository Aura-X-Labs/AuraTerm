[package]
name = "auraterm"
version = "0.1.0"
description = "AuraTerm - Modern TeraTerm alternative"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-shell = "2.0.0"
portable-pty = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.21.0", features = ["v4"] }
tauri-plugin-os = "2.3.2"
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros", "sync", "full"] }
async-trait = "0.1.89"
anyhow = "1.0.102"
russh = "0.57.1"
russh-keys = "0.49.2"
ssh-key = "0.6.7"
