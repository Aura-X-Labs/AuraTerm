[package]
name = "auraterm"
version = "0.2.7"
description = "AuraTerm - A modern, cross-platform terminal emulator built with Tauri"
authors = ["William Yang"]
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }
chrono = "0.4"

[dependencies]
tauri = { version = "2.10.3", features = [] }
tauri-plugin-shell = "2.3.5"
portable-pty = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.21.0", features = ["v4"] }
tauri-plugin-os = "2.3.2"
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros", "sync", "fs", "net", "io-util", "time"] }
async-trait = "0.1.89"
anyhow = "1.0.102"
libc = "0.2"
russh = "0.60.1"
russh-sftp = "2.1.1"
ssh-key = "0.6.7"
serialport = "4.8.1"
# keyring v3 requires explicit platform backend features; without them the
# crate silently falls back to a mock in-memory store (writes succeed but
# reads never find the entry). Enable the native credential store on each
# supported desktop platform.
keyring = { version = "3.6.2", features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
