[package]
name = "auraterm"
version = "0.3.0"
description = "AuraTerm - A modern, cross-platform terminal emulator built with Tauri"
authors = ["William Yang"]
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }
chrono = "0.4"

[dependencies]
tauri = { version = "2.10.3", features = [] }
tauri-plugin-shell = "2.3.5"
# Native message/confirm dialogs. The WebView's own window.confirm/alert/
# prompt are silent no-ops on macOS (wry implements no WKUIDelegate JS
# dialog handlers), so all confirmations must go through this plugin.
tauri-plugin-dialog = "2.7.2"
portable-pty = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.21.0", features = ["v4"] }
tauri-plugin-os = "2.3.2"
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros", "sync", "fs", "net", "io-util", "time"] }
async-trait = "0.1.89"
anyhow = "1.0.102"
libc = "0.2"
russh = "0.60.1"
russh-sftp = "2.1.1"
ssh-key = "0.6.7"
zmodem2 = "0.7.1"
serialport = "4.8.1"
aes-gcm = "0.10"
p256 = { version = "0.13", features = ["ecdh"] }
# Ed25519 device identity + capability verification for Cloud Console
# (ADR #1). Pure-Rust, no C toolchain.
ed25519-dalek = { version = "2", features = ["rand_core"] }
hkdf = "0.12"
sha2 = "0.10"
argon2 = "0.5"
zeroize = { version = "1.6", features = ["derive"] }
base64 = "0.21"
rand = "0.8"
# HTTP client for end-to-end-encrypted cloud sync (GitHub/Gitee Gist, WebDAV,
# AuraXLab account) and AI assistant streaming. rustls-tls reuses aws-lc-rs
# already pulled in by russh, so no OpenSSL/native-tls system dependency is
# added on any platform. "stream" exposes bytes_stream() for SSE consumption.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
# StreamExt for consuming reqwest byte streams (AI assistant SSE).
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
# WebSocket transport for the Cloud Console bridge (standalone wss relay).
# rustls reuses the same TLS stack as reqwest/russh; no native TLS added.
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }

# OS keychain for opt-in "remember master password" auto-unlock.
# Scoped to macOS/Windows native backends so Linux does not pull in
# secret-service / DBus (the dependency the app deliberately shed earlier).
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[dev-dependencies]
# Lightweight in-process HTTP server for cloud-sync provider integration tests
# (mock GitHub/Gitee Gist, WebDAV and AuraXLab vault endpoints).
tiny_http = "0.12"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
