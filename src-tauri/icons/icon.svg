<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cfe7ef"/>
      <stop offset="0.25" stop-color="#8a949c"/>
      <stop offset="0.55" stop-color="#e6eef2"/>
      <stop offset="0.85" stop-color="#6f787f"/>
      <stop offset="1" stop-color="#d6e7ee"/>
    </linearGradient>

    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2c2e"/>
      <stop offset="1" stop-color="#111214"/>
    </linearGradient>

    <radialGradient id="shine" cx="30%" cy="20%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- rim -->
    <rect x="120" y="120" width="784" height="784" rx="165" fill="#0b0b0c"/>
    <rect x="132" y="132" width="760" height="760" rx="155" fill="url(#rim)"/>

    <!-- inner panel -->
    <rect x="178" y="178" width="668" height="668" rx="135" fill="url(#panel)"/>
    <rect x="178" y="178" width="668" height="668" rx="135" fill="url(#shine)"/>

    <!-- prompt -->
    <path d="M310 300 L404 360 L310 420" fill="none" stroke="#e9f6ff" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
    <line x1="440" y1="420" x2="565" y2="420" stroke="#e9f6ff" stroke-width="34" stroke-linecap="round" opacity="0.95"/>

    <!-- 3-line left-aligned label block -->
    <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
       font-weight="500"
       text-anchor="start"
       fill="#d5dde2"
       opacity="0.92">
      <text x="300" y="570" font-size="80" letter-spacing="1.5">ssh</text>
      <text x="300" y="660" font-size="80" letter-spacing="1.5">telnet</text>
      <text x="300" y="750" font-size="80" letter-spacing="1.5">serial</text>
    </g>
  </g>
</svg>